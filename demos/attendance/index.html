<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Attendance Tracker · Demo</title>
<style>
  :root {
    --bg:#0f171e; --card:#1a242f; --line:#2b3742; --ink:#f2f4f5; --muted:#aab7b8;
    --blue:#00a8e1; --btnText:#0f171e;
    --gBg:#12301f; --gFg:#7ee2a8; --gDot:#22c55e;
    --yBg:#33290b; --yFg:#f5cc4a; --yDot:#eab308;
    --rBg:#3a1512; --rFg:#ff9b91; --rDot:#f04438;
    --blueSoft:#0d2d3d; --out:#5b6873; --grey:#6b7a86; --scheme:dark;
  }
  body.light {
    --bg:#ffffff; --card:#ffffff; --line:#e3e6e6; --ink:#0f1111; --muted:#565959;
    --blue:#0073a8; --btnText:#ffffff;
    --gBg:#e8f6ee; --gFg:#0b6b38; --gDot:#16a34a;
    --yBg:#fdf6dc; --yFg:#7a5900; --yDot:#e0a800;
    --rBg:#fdecea; --rFg:#a3170c; --rDot:#d92d20;
    --blueSoft:#e6f6fc; --out:#8a9499; --grey:#aab7b8; --scheme:light;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Amazon Ember",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .top { border-bottom:1px solid var(--line); }
  .wrap { max-width:1080px; margin:0 auto; padding:14px 20px; }
  .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo b { font-size:20px; font-weight:800; } .logo span { font-size:20px; color:var(--blue); }
  .clock { margin-left:auto; text-align:right; }
  .mono { font-family:ui-monospace,Menlo,monospace; }
  .clock div:first-child { font-size:18px; font-weight:600; }
  .small { font-size:12px; color:var(--muted); }
  .btn { font:inherit; font-size:14px; font-weight:600; padding:10px 18px; border-radius:999px; border:none;
    background:var(--blue); color:var(--btnText); cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.stop { background:var(--rDot); color:#fff; }
  .ghost { font:inherit; font-size:13px; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; }
  .ghost.on { border-color:var(--blue); color:var(--blue); }
  input { font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink); color-scheme:var(--scheme); }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .card { border:1px solid var(--line); border-radius:12px; padding:18px; background:var(--card);
    display:flex; flex-direction:column; gap:10px; min-height:170px; }
  .card.active { border-color:var(--blue); }
  .head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .time { font-size:28px; font-weight:600; }
  .big { font-size:40px; font-weight:700; letter-spacing:.02em; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:4px; margin-right:6px; }
  .green { background:var(--gBg); color:var(--gFg); } .green .dot { background:var(--gDot); }
  .yellow { background:var(--yBg); color:var(--yFg); } .yellow .dot { background:var(--yDot); }
  .red { background:var(--rBg); color:var(--rFg); } .red .dot { background:var(--rDot); }
  .chip { display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; border:none; font-family:inherit; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; font-size:14px; }
  th { text-align:left; padding:10px 12px 10px 0; font-size:13px; border-bottom:2px solid var(--line); }
  td { padding:10px 12px 10px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .stats { display:flex; gap:40px; flex-wrap:wrap; margin-bottom:20px; }
  .stats .n { font-size:28px; font-weight:700; }
  .err { background:var(--rBg); color:var(--rFg); padding:10px 14px; border-radius:10px; font-size:14px; margin-bottom:16px; }
  .panel { border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:24px; }
  .hidden { display:none !important; }
  .linkbtn { font:inherit; background:none; border:none; padding:0; color:var(--ink); cursor:pointer; text-align:left; }
  .linkbtn b { border-bottom:1px dashed var(--muted); }
  .linkbtn:hover b { color:var(--blue); border-bottom-color:var(--blue); }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:6px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .hist { display:grid; grid-template-columns:minmax(260px,320px) 1fr; gap:20px; margin-top:32px; }
  @media (max-width:720px) { .hist { grid-template-columns:1fr; } }
  .cal { border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--card); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px; }
  .cal-grid .dow { font-size:11px; color:var(--muted); text-align:center; padding:4px 0; }
  .day { font:inherit; font-size:13px; aspect-ratio:1; border-radius:8px; border:1px solid transparent; background:none;
    color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .day:hover { border-color:var(--line); }
  .day.out { color:var(--out); }
  .day.today { border-color:var(--muted); }
  .day.sel { background:var(--blue); color:var(--btnText); font-weight:700; }
  .day.week { background:var(--blueSoft); }
  .day .d { width:6px; height:6px; border-radius:3px; }
  .detail { border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--card); }
  .detail h4 { margin:0 0 4px; font-size:15px; text-transform:capitalize; }
  .daybox { padding:10px 0; border-bottom:1px solid var(--line); }
  .daybox:last-child { border-bottom:none; }
</style>
</head>
<body>
<script>
/* ===== DEMO BACKEND: tiny Firestore-like store on localStorage (no server, no accounts) ===== */
(function(){
  const KEY='att-demo-db', subs=new Set();
  const load=()=>JSON.parse(localStorage.getItem(KEY)||'{}'), save=d=>{localStorage.setItem(KEY,JSON.stringify(d));subs.forEach(f=>f());};
  function seed(){ if(localStorage.getItem(KEY))return;
    const names=['Ana Mora','Luis Vargas','Sofía Rojas','Diego Solís','Valeria Castro'];
    const d={config:{people:{list:names.map((n,i)=>({name:n,code:String(1111*(i+1))}))}},days:{}};
    const OFF=6*3600e3, now=Date.now();
    for(let back=1;back<=12;back++){ const t=now-back*864e5, c=new Date(t-OFF), wd=c.getUTCDay(); if(wd===0||wd===6)continue;
      const k=`${c.getUTCFullYear()}-${String(c.getUTCMonth()+1).padStart(2,'0')}-${String(c.getUTCDate()).padStart(2,'0')}`;
      names.forEach((_,row)=>{ const entry=415+Math.floor(Math.random()*30), ls=Date.UTC(c.getUTCFullYear(),c.getUTCMonth(),c.getUTCDate(),12,Math.floor(Math.random()*30))+OFF;
        d.days[`${k}_${row}`]={date:k,row,entry,entryAt:t,lunch:{start:ls,end:ls+(52+Math.floor(Math.random()*20))*60e3}}; }); }
    localStorage.setItem(KEY,JSON.stringify(d)); }
  seed();
  const snapOf=docs=>({forEach:f=>docs.forEach(v=>f({data:()=>v}))});
  function doc(col,id){ return {
    set(v,o){ const d=load(); d[col]=d[col]||{}; const prev=d[col][id]||{};
      const merge=(a,b)=>{const r={...a};for(const k in b)r[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')?merge(a[k],b[k]):b[k];return r;};
      d[col][id]=o&&o.merge?merge(prev,v):v; save(d); return Promise.resolve(); },
    onSnapshot(cb){ const f=()=>{const v=(load()[col]||{})[id]; cb({exists:!!v,data:()=>v});}; subs.add(f); setTimeout(f); return ()=>subs.delete(f); } }; }
  function where(col,field,_,val){ return { onSnapshot(cb){ const f=()=>cb(snapOf(Object.values(load()[col]||{}).filter(x=>x[field]===val))); subs.add(f); setTimeout(f); return ()=>subs.delete(f);} }; }
  window.firebase={ initializeApp(){}, firestore:()=>({ collection:c=>({ doc:id=>doc(c,id), where:(f,o,v)=>where(c,f,o,v) }) }) };
  window.addEventListener('storage',()=>subs.forEach(f=>f()));
})();
</script>
<div style="background:linear-gradient(90deg,#62b6cb,#5fa8d3);color:#fff;text-align:center;padding:9px 12px;font:600 13px system-ui">
  🧪 DEMO — try code <b>1111</b> (intern) or <b>0000</b> (admin). Data is saved only in your browser.
  <button onclick="localStorage.removeItem('att-demo-db');location.reload()" style="margin-left:8px;border:0;border-radius:999px;padding:3px 10px;cursor:pointer">Reset</button>
</div>
<div class="top"><div class="wrap bar">
  <div class="logo"><b>Attend</b><span>Demo</span></div>
  <span class="small" id="role"></span>
  <div class="clock"><div id="clock" class="mono"></div><div class="small">Costa Rica time</div></div>
  <button class="ghost" id="theme" aria-label="Change theme" style="padding:7px 9px;display:inline-flex"></button>
  <button class="ghost hidden" id="logout">Log out</button>
</div></div>

<div class="wrap" style="padding-top:24px;padding-bottom:80px">
  <div id="error" class="err hidden"></div>

  <div id="login" class="hidden" style="max-width:360px;padding:40px 0">
    <div style="font-size:22px;font-weight:700">Enter your code</div>
    <div class="small" style="font-size:14px;margin-top:6px">Use the code your admin gave you.</div>
    <label style="margin-top:20px">Code
      <input id="codeInput" inputmode="numeric" class="mono" style="font-size:20px;letter-spacing:.2em" />
    </label>
    <div id="codeErr" class="small hidden" style="color:var(--rFg);margin-top:8px">Invalid code.</div>
    <button class="btn" id="enter" style="margin-top:14px;width:100%">Enter</button>
  </div>

  <div id="adminBar" class="bar hidden" style="margin-bottom:20px">
    <label>Date <input type="date" id="date" /></label>
    <button class="ghost" id="toggleEdit" style="margin-top:auto">Edit interns</button>
  </div>
  <div id="editPanel" class="panel hidden"></div>

  <div id="view"></div>
  <div class="small" id="rules" style="margin-top:32px;line-height:1.7"></div>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const firebaseConfig = {}; // DEMO: data is stored in this browser only
/* Administradores: nombre y código de cada uno */
const ADMINS = [ { name: "Demo Admin", code: "0000" } ];
/* ====================================== */

/* Entrada: verde hasta 7:05, amarillo hasta 7:20, rojo después. Se puede marcar desde las 6:00 */
const ENTRY = { open:360, onTime:425, late:440 };
/* Lunch: dura 1 hora. Verde hasta 60 min, amarillo hasta 70 min, rojo después */
const LUNCH_MIN = 60, LUNCH_YELLOW = 70;
const LABEL = { green:'On time', yellow:'Late', red:'Very late' };
const DEFAULT_PEOPLE = Array.from({length:10}, (_, i) => ({ name:`Intern ${i+1}`, code:'' }));
const OFF = 6*3600*1000; // Costa Rica UTC-6

const p2 = n => String(n).padStart(2,'0');
function crParts(ms) { const d=new Date(ms-OFF); return { y:d.getUTCFullYear(), mo:d.getUTCMonth(), d:d.getUTCDate(), h:d.getUTCHours(), mi:d.getUTCMinutes(), s:d.getUTCSeconds(), wd:d.getUTCDay() }; }
function crNow() { const c=crParts(Date.now()); return { date:`${c.y}-${p2(c.mo+1)}-${p2(c.d)}`, minutes:c.h*60+c.mi, seconds:c.s }; }
function fmt(m) { const h=Math.floor(m/60)%24, mm=m%60; return `${((h+11)%12)+1}:${p2(mm)} ${h<12?'a.m.':'p.m.'}`; }
function fmtMs(ms) { const c=crParts(ms); return fmt(c.h*60+c.mi); }
function dur(ms) { const t=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return `${h?h+':'+p2(m):m}:${p2(s)}`; }
function durText(ms) { const m=Math.round(ms/60000); return m>=60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; }
const entryStatus = m => m <= ENTRY.onTime ? 'green' : m <= ENTRY.late ? 'yellow' : 'red';
const lunchStatus = ms => { const m=ms/60000; return m <= LUNCH_MIN ? 'green' : m <= LUNCH_YELLOW ? 'yellow' : 'red'; };
const lunchLabel = st => ({ green:'On time', yellow:'A bit over', red:'Over' }[st]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const dateKey = (y,mo,d) => `${y}-${p2(mo+1)}-${p2(d)}`;
function parseKey(k) { const [y,m,d]=k.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function keyOf(dt) { return dateKey(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()); }
function addDays(k, n) { const d=parseKey(k); d.setUTCDate(d.getUTCDate()+n); return keyOf(d); }
function longDate(k) { return parseKey(k).toLocaleDateString('en-US',{ timeZone:'UTC', weekday:'long', day:'numeric', month:'long' }); }

let db, people = DEFAULT_PEOPLE, peopleLoaded = false, code = localStorage.getItem('att-demo-code') || '';
let date = crNow().date;        // fecha del tablero de admin
let dayData = {};               // admin: `${row}` -> {entry, lunch} del día elegido
let myData = {};                // practicante: date -> {entry, lunch}
let unsubDay = null, unsubMine = null, mineRow = -1;
let calMonth = (() => { const c=crParts(Date.now()); return { y:c.y, mo:c.mo }; })();
let selDay = crNow().date, histMode = 'day', viewRow = null;

function showError(msg) { const e=$('error'); e.textContent=msg; e.classList.toggle('hidden', !msg); }
try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
catch (e) { showError('Missing configuration.'); }

const adminOf = c => ADMINS.find(a => a.code === c);
const isAdmin = () => !!(code && adminOf(code));
const myRow = () => people.findIndex(p => p.code && p.code === code);

/* ---------- Datos ---------- */
function listenPeople() {
  db.collection('config').doc('people').onSnapshot(doc => {
    const arr = doc.exists ? doc.data().list : null;
    people = Array.isArray(arr) && arr.length ? arr : DEFAULT_PEOPLE;
    peopleLoaded = true; route();
  }, e => showError('Could not read the list: ' + e.message));
}
function listenDay() {
  if (unsubDay) unsubDay();
  unsubDay = db.collection('days').where('date','==',date).onSnapshot(snap => {
    dayData = {}; snap.forEach(d => { const v=d.data(); dayData[v.row] = v; }); render();
  }, e => showError('Could not read records: ' + e.message));
}
function listenMine(row) {
  if (mineRow === row && unsubMine) return;
  if (unsubMine) unsubMine();
  mineRow = row;
  unsubMine = db.collection('days').where('row','==',row).onSnapshot(snap => {
    myData = {}; snap.forEach(d => { const v=d.data(); myData[v.date] = v; }); render();
  }, e => showError('Could not read your records: ' + e.message));
}
const docRef = (d, row) => db.collection('days').doc(`${d}_${row}`);
async function patch(d, row, fields) { await docRef(d,row).set({ date:d, row, ...fields }, { merge:true }); }

/* ---------- Pantallas ---------- */
function route() {
  const logged = isAdmin() || (peopleLoaded && myRow() >= 0);
  if (code && peopleLoaded && !logged) { code=''; localStorage.removeItem('att-demo-code'); }
  $('login').classList.toggle('hidden', !!(code && logged) || !peopleLoaded);
  $('logout').classList.toggle('hidden', !code);
  $('adminBar').classList.toggle('hidden', !isAdmin());
  if (!isAdmin()) $('editPanel').classList.add('hidden');
  $('role').textContent = isAdmin() ? `Admin · ${adminOf(code).name}` : (code ? 'Attendance' : '');
  if (isAdmin() && !unsubDay) listenDay();
  if (!isAdmin() && myRow() >= 0) listenMine(myRow());
  if (!peopleLoaded) $('view').innerHTML = '<div class="small" style="padding:40px 0">Loading</div>';
  render();
}
function render() {
  if (!peopleLoaded) return;
  const v = $('view');
  if (!code) { v.innerHTML=''; return; }
  if (isAdmin()) v.innerHTML = (viewRow != null && people[viewRow]) ? profileView(viewRow) : adminView();
  else if (myRow() >= 0) v.innerHTML = internView(myRow());
}

/* ---------- Practicante ---------- */
function internView(row) {
  const now = crNow(), today = myData[now.date] || {};
  const first = esc(people[row].name.split(' ')[0]);
  return `<div style="margin-bottom:20px"><div style="font-size:22px;font-weight:700">Hi, ${first}</div>
    <div class="small" style="font-size:14px;text-transform:capitalize">${longDate(now.date)}</div></div>
    <div class="grid2">${entryCard(row, today, now, false, now.date)}${lunchCard(row, today, false, now.date)}</div>
    ${historyView()}`;
}
function adminEditBtn(fn, row, k, label) { return `<button class="ghost" style="margin-top:8px;align-self:flex-start" onclick="${fn}(${row},'${k}')">${label}</button>`; }
function entryCard(row, d, now, adm, k) {
  const head = `<div class="head"><b>Clock-in</b><span class="small">7:00 a.m.</span></div>`;
  const edit = adm ? adminEditBtn('editEntry', row, k, d.entry != null ? 'Edit clock-in' : 'Add clock-in') : '';
  if (d.entry != null) { const st=entryStatus(d.entry);
    return `<div class="card ${st}">${head}<div style="margin-top:auto"><div class="time mono">${fmt(d.entry)}</div>
      <div style="font-size:13px;font-weight:600"><span class="dot"></span>${LABEL[st]}</div></div>${edit}</div>`; }
  if (adm) return `<div class="card">${head}<div class="small" style="margin-top:auto;font-size:13px">No record</div>${edit}</div>`;
  if (now.minutes < ENTRY.open)
    return `<div class="card">${head}<div class="small" style="margin-top:auto;font-size:13px">Available from ${fmt(ENTRY.open)}</div></div>`;
  const late = now.minutes > ENTRY.late;
  return `<div class="card active">${head}<button class="btn ${late?'stop':''}" style="margin-top:auto" onclick="markEntry(${row})">Clock in</button></div>`;
}
function lunchCard(row, d, adm, k) {
  const head = `<div class="head"><b>Lunch</b><span class="small">1 hour</span></div>`;
  const L = d.lunch || {};
  const edit = adm ? adminEditBtn('editLunch', row, k, L.start ? 'Edit lunch' : 'Add lunch') : '';
  if (!L.start) {
    if (adm) return `<div class="card">${head}<div class="small" style="margin-top:auto;font-size:13px">No lunch</div>${edit}</div>`;
    return `<div class="card">${head}<div class="small" style="font-size:13px">Tap it when you go to lunch. The timer starts and it can't be undone.</div>
      <button class="btn" style="margin-top:auto" onclick="startLunch(${row})">Start lunch</button></div>`;
  }
  const planned = L.start + LUNCH_MIN*60000;
  if (!L.end) {
    const el = Date.now() - L.start, over = el > LUNCH_MIN*60000;
    return `<div class="card active">${head}
      <div class="row"><span class="small">Started</span><b class="mono">${fmtMs(L.start)}</b></div>
      <div class="row"><span class="small">Ends</span><b class="mono">${fmtMs(planned)}</b></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap">
        <div><div class="small">${over?(adm?'Over by':'You went over by'):(adm?'Time left':'Time left')}</div>
          <div class="big mono" id="lunchLeft" style="color:${over?'var(--rFg)':'var(--blue)'}">${dur(over ? el-LUNCH_MIN*60000 : LUNCH_MIN*60000-el)}</div></div>
        <div style="text-align:right"><div class="small">${adm?'Elapsed':'Elapsed'}</div><div class="mono" id="lunchEl" style="font-size:18px;font-weight:600">${dur(el)}</div></div>
      </div>
      ${adm ? edit : `<button class="btn stop" onclick="endLunch(${row})">End lunch</button>`}</div>`;
  }
  const total = L.end - L.start, st = lunchStatus(total), over = total - LUNCH_MIN*60000;
  return `<div class="card ${st}">${head}
    <div class="time mono">${fmtMs(L.start)} – ${fmtMs(L.end)}</div>
    <div style="font-size:13px;font-weight:600"><span class="dot"></span>${durText(total)} · ${lunchLabel(st)}${over>60000?` (+${durText(over)})`:''}</div>${edit}</div>`;
}

/* ---------- Perfil de practicante visto por un administrador ---------- */
function profileView(row) {
  const now = crNow(), k = selDay, d = myData[k] || {}, p = people[row];
  return `<div class="bar" style="margin-bottom:16px"><button class="ghost" onclick="closeProfile()">‹ Back to table</button></div>
    <div style="margin-bottom:20px"><div style="font-size:22px;font-weight:700">${esc(p.name)}</div>
    <div class="small" style="font-size:14px">Intern profile · ${p.code ? 'Code ' + esc(p.code) : 'No code'}</div>
    <div style="font-size:15px;font-weight:600;margin-top:6px;text-transform:capitalize">${longDate(k)}${k===now.date?' · today':''}</div></div>
    <div class="grid2">${entryCard(row, d, now, true, k)}${lunchCard(row, d, true, k)}</div>
    ${historyView()}`;
}
window.openProfile = r => {
  viewRow = r; selDay = date; histMode = 'day';
  const dt = parseKey(date); calMonth = { y: dt.getUTCFullYear(), mo: dt.getUTCMonth() };
  myData = {}; listenMine(r); render(); window.scrollTo(0, 0);
};
window.closeProfile = () => { viewRow = null; render(); };

/* ---------- Historial con calendario ---------- */
function historyView() {
  const { y, mo } = calMonth;
  const first = new Date(Date.UTC(y, mo, 1)), startW = (first.getUTCDay()+6)%7; // lunes = 0
  const today = crNow().date;
  const wkStart = addDays(selDay, -((parseKey(selDay).getUTCDay()+6)%7)), wkEnd = addDays(wkStart, 6);
  let cells = ['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for (let i=0;i<42;i++) {
    const k = keyOf(new Date(Date.UTC(y, mo, 1 - startW + i)));
    const inMonth = parseKey(k).getUTCMonth() === mo, rec = myData[k];
    const cls = ['day', inMonth?'':'out', k===today?'today':'', k===selDay?'sel':'', histMode==='week'&&k>=wkStart&&k<=wkEnd&&k!==selDay?'week':''].join(' ');
    const dot = rec && rec.entry!=null ? `<span class="d" style="background:var(--${entryStatus(rec.entry)[0]}Dot)"></span>` : '<span class="d"></span>';
    cells += `<button class="${cls}" onclick="pickDay('${k}')">${Number(k.slice(8))}${dot}</button>`;
    if (i>=34 && !inMonth && parseKey(k).getUTCDay()===0) break;
  }
  const monthName = first.toLocaleDateString('en-US',{ timeZone:'UTC', month:'long', year:'numeric' });
  let detail;
  if (histMode==='day') detail = `<h4>${longDate(selDay)}</h4>${dayDetail(selDay)}`;
  else {
    let boxes='', mins=0, lunches=0, ontime=0, days=0;
    for (let i=0;i<7;i++) { const k=addDays(wkStart,i), r=myData[k];
      if (r && (r.entry!=null || (r.lunch&&r.lunch.start))) { days++;
        if (r.entry!=null && entryStatus(r.entry)==='green') ontime++;
        if (r.lunch && r.lunch.end) { mins += (r.lunch.end-r.lunch.start); lunches++; } }
      boxes += `<div class="daybox"><div style="font-weight:600;font-size:14px;text-transform:capitalize">${longDate(k)}</div>${dayDetail(k, true)}</div>`; }
    detail = `<h4>Week of ${longDate(wkStart).replace(/^\S+\s/,'')} – ${longDate(wkEnd).replace(/^\S+\s/,'')}</h4>
      <div class="small" style="margin-bottom:6px">${days} days with records · ${ontime} on-time clock-ins${lunches?` · avg lunch ${durText(mins/lunches)}`:''}</div>${boxes}`;
  }
  return `<div class="hist">
    <div class="cal">
      <div class="bar" style="gap:8px"><button class="ghost" onclick="moveMonth(-1)" aria-label="Previous month">‹</button>
        <b style="flex:1;text-align:center;text-transform:capitalize">${monthName}</b>
        <button class="ghost" onclick="moveMonth(1)" aria-label="Next month">›</button></div>
      <div class="cal-grid">${cells}</div>
      <div class="bar" style="gap:6px;margin-top:12px;justify-content:center">
        <button class="ghost ${histMode==='day'?'on':''}" onclick="setMode('day')">By day</button>
        <button class="ghost ${histMode==='week'?'on':''}" onclick="setMode('week')">By week</button>
      </div>
    </div>
    <div class="detail">${detail}</div></div>`;
}
function dayDetail(k, compact) {
  const r = myData[k];
  if (!r || (r.entry==null && !(r.lunch && r.lunch.start))) return `<div class="small" style="padding:${compact?'4px':'10px'} 0">No records</div>`;
  let h = '';
  if (r.entry!=null) { const st=entryStatus(r.entry);
    h += `<div class="row"><span>Clock-in</span><span><b class="mono">${fmt(r.entry)}</b> <span class="chip ${st}" style="cursor:default;padding:2px 8px;font-size:12px"><span class="dot"></span>${LABEL[st]}</span></span></div>`; }
  else h += `<div class="row"><span>Clock-in</span><span class="small">No record</span></div>`;
  const L = r.lunch;
  if (L && L.start && L.end) { const t=L.end-L.start, st=lunchStatus(t), over=t-LUNCH_MIN*60000;
    h += `<div class="row"><span>Lunch</span><b class="mono">${fmtMs(L.start)} – ${fmtMs(L.end)}</b></div>
      <div class="row"><span>Duration</span><span><b>${durText(t)}</b> <span class="chip ${st}" style="cursor:default;padding:2px 8px;font-size:12px"><span class="dot"></span>${over>60000?'+'+durText(over):'On time'}</span></span></div>`; }
  else if (L && L.start) h += `<div class="row"><span>Lunch</span><span><b class="mono">${fmtMs(L.start)}</b> <span class="small">in progress</span></span></div>`;
  else h += `<div class="row"><span>Lunch</span><span class="small">No record</span></div>`;
  return h;
}
window.pickDay = k => { selDay = k; render(); };
window.setMode = m => { histMode = m; render(); };
window.moveMonth = n => { let { y, mo } = calMonth; mo += n; if (mo<0){mo=11;y--;} if (mo>11){mo=0;y++;} calMonth={y,mo}; render(); };

/* ---------- Acciones del practicante (solo una vez cada una) ---------- */
window.markEntry = async row => {
  const d = crNow().date;
  if (row !== myRow() || (myData[d] && myData[d].entry != null)) return;
  try { await patch(d, row, { entry: crNow().minutes, entryAt: Date.now() }); showError(''); }
  catch (e) { showError('Could not save: ' + e.message); }
};
window.startLunch = async row => {
  const d = crNow().date, L = (myData[d]||{}).lunch;
  if (row !== myRow() || (L && L.start)) return;
  if (!confirm('Start lunch now? A 1-hour timer starts and it cannot be undone.')) return;
  try { await patch(d, row, { lunch: { start: Date.now(), end: null } }); showError(''); }
  catch (e) { showError('Could not save: ' + e.message); }
};
window.endLunch = async row => {
  const d = crNow().date, L = (myData[d]||{}).lunch;
  if (row !== myRow() || !L || !L.start || L.end) return;
  if (!confirm('End lunch now? It cannot be changed afterwards.')) return;
  try { await patch(d, row, { lunch: { start: L.start, end: Date.now() } }); showError(''); }
  catch (e) { showError('Could not save: ' + e.message); }
};

/* ---------- Administrador ---------- */
function adminView() {
  const now = crNow(), isToday = date === now.date;
  const c = { green:0, yellow:0, red:0, pending:0, inLunch:0 };
  people.forEach((_, r) => { const d=dayData[r]||{}; d.entry!=null ? c[entryStatus(d.entry)]++ : c.pending++; if (d.lunch && d.lunch.start && !d.lunch.end) c.inLunch++; });
  const stat = (l,n,col) => `<div><div class="small"><span class="dot" style="background:${col}"></span>${l}</div><div class="n">${n}</div></div>`;
  const rows = people.map((p, r) => {
    const d = dayData[r] || {}, L = d.lunch || {};
    let e;
    if (d.entry!=null) { const st=entryStatus(d.entry); e=`<button class="chip ${st}" onclick="editEntry(${r})"><span class="dot"></span>${fmt(d.entry)} · ${LABEL[st]}</button>`; }
    else { const missed = !isToday || now.minutes > ENTRY.late; e=`<button class="ghost" style="${missed?'color:var(--rFg)':''}" onclick="editEntry(${r})">${missed?'No record':'Pending'}</button>`; }
    let l;
    if (L.start && L.end) { const t=L.end-L.start, st=lunchStatus(t); l=`<button class="chip ${st}" onclick="editLunch(${r})"><span class="dot"></span>${fmtMs(L.start)} – ${fmtMs(L.end)} · ${durText(t)}</button>`; }
    else if (L.start) { const el=Date.now()-L.start, over=el>LUNCH_MIN*60000; l=`<button class="chip ${over?'red':''}" style="${over?'':'background:var(--blueSoft);color:var(--blue)'}" onclick="editLunch(${r})"><span class="dot" style="background:var(--blue)"></span>En lunch desde ${fmtMs(L.start)} · <span class="mono" style="margin-left:4px">${dur(el)}</span></button>`; }
    else l=`<button class="ghost" onclick="editLunch(${r})">No lunch</button>`;
    return `<tr><td><button class="linkbtn" onclick="openProfile(${r})" title="View profile"><b>${esc(p.name)}</b></button><div class="small">${p.code?'Code '+esc(p.code):'No code'}</div></td><td>${e}</td><td>${l}</td></tr>`;
  }).join('');
  return `<div class="stats">${stat('On-time clock-in',c.green,'var(--gDot)')}${stat('Late',c.yellow,'var(--yDot)')}${stat('Very late',c.red,'var(--rDot)')}${stat('No clock-in',c.pending,'var(--grey)')}${stat('At lunch now',isToday?c.inLunch:0,'var(--blue)')}</div>
    <div class="table-wrap"><table><thead><tr><th>Practicante</th><th>Entrada<div class="small">7:00 a.m.</div></th><th>Lunch<div class="small">1 hora</div></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="small" style="margin-top:10px">Tap a name to see their profile and calendar. Tap a cell to add, change or delete a record.</div>`;
}
const toHHMM = m => `${p2(Math.floor(m/60))}:${p2(m%60)}`;
const parseHHMM = v => { const m=v.trim().match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1])*60+Number(m[2]) : null; };
const msAt = (k, minutes) => parseKey(k).getTime() + minutes*60000 + OFF;
const minOfMs = ms => { const c=crParts(ms); return c.h*60+c.mi; };
const recOf = (r, k) => (mineRow === r && myData[k]) || (k === date && dayData[r]) || {};
window.editEntry = async (r, k) => {
  if (!isAdmin()) return;
  k = k || date;
  const d = recOf(r, k);
  const v = prompt(`${people[r].name} · Clock-in\nTime in 24 h format (e.g. 07:03). Leave empty to delete.`, d.entry!=null ? toHHMM(d.entry) : '');
  if (v === null) return;
  try {
    if (!v.trim()) return await patch(k, r, { entry: null });
    const m = parseHHMM(v); if (m == null) return showError('Invalid time. Use the 07:03 format.');
    await patch(k, r, { entry: m, editedBy: adminOf(code).name }); showError('');
  } catch (e) { showError('Could not save: ' + e.message); }
};
window.editLunch = async (r, k) => {
  if (!isAdmin()) return;
  k = k || date;
  const L = recOf(r, k).lunch || {};
  const cur = L.start ? `${toHHMM(minOfMs(L.start))}-${L.end ? toHHMM(minOfMs(L.end)) : ''}` : '';
  const v = prompt(`${people[r].name} · Lunch\nType start-end in 24 h (e.g. 12:00-13:05).\nStart only (e.g. 12:00-) leaves it in progress. Empty to delete.`, cur);
  if (v === null) return;
  try {
    if (!v.trim()) return await patch(k, r, { lunch: null });
    const [a, b] = v.split('-'); const s = parseHHMM(a||''), e = b && b.trim() ? parseHHMM(b) : null;
    if (s == null || (b && b.trim() && e == null)) return showError('Invalid format. Use 12:00-13:05.');
    if (e != null && e < s) return showError('End cannot be before start.');
    await patch(k, r, { lunch: { start: msAt(k, s), end: e != null ? msAt(k, e) : null }, editedBy: adminOf(code).name }); showError('');
  } catch (e) { showError('Could not save: ' + e.message); }
};

function openEdit() {
  const p = $('editPanel');
  p.innerHTML = `<div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${people.map((x,i)=>`
    <div style="display:flex;flex-direction:column;gap:6px">
      <label>Nombre ${i+1}<input data-n="${i}" value="${esc(x.name)}" /></label>
      <label>Code<div style="display:flex;gap:6px"><input data-c="${i}" value="${esc(x.code||'')}" inputmode="numeric" class="mono" style="flex:1;min-width:0" />
      <button class="ghost" onclick="document.querySelector('[data-c=\\'${i}\\']').value=String(Math.floor(100000+Math.random()*900000))">Generate</button></div></label>
    </div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="ghost" id="addRow">Add intern</button>
      <button class="btn" id="savePeople">Save</button>
    </div>`;
  $('addRow').onclick = () => { people = collect(); people = [...people, { name:`Intern ${people.length+1}`, code:'' }]; openEdit(); };
  $('savePeople').onclick = async () => {
    const list = collect(), codes = list.map(x=>x.code).filter(Boolean);
    if (new Set(codes).size !== codes.length) return showError('There are duplicate codes.');
    if (codes.some(c => adminOf(c))) return showError('An intern cannot use an admin code.');
    try { await db.collection('config').doc('people').set({ list }); showError(''); p.classList.add('hidden'); $('toggleEdit').textContent='Edit interns'; }
    catch (e) { showError('Could not save: ' + e.message); }
  };
  p.classList.remove('hidden');
}
function collect() {
  return people.map((x,i) => ({
    name: (document.querySelector(`[data-n="${i}"]`)?.value || '').trim() || `Intern ${i+1}`,
    code: (document.querySelector(`[data-c="${i}"]`)?.value || '').trim(),
  }));
}

$('enter').onclick = () => {
  const c = $('codeInput').value.trim();
  if (adminOf(c) || people.some(p => p.code && p.code === c)) {
    code = c; localStorage.setItem('att-demo-code', c); $('codeInput').value=''; $('codeErr').classList.add('hidden'); route();
  } else $('codeErr').classList.remove('hidden');
};
$('codeInput').onkeydown = e => { if (e.key === 'Enter') $('enter').click(); };
$('logout').onclick = () => { code=''; localStorage.removeItem('att-demo-code'); if (unsubMine) { unsubMine(); unsubMine=null; mineRow=-1; } myData={}; viewRow=null; route(); };
$('toggleEdit').onclick = () => {
  const hidden = $('editPanel').classList.contains('hidden');
  if (hidden) { openEdit(); $('toggleEdit').textContent='Close'; } else { $('editPanel').classList.add('hidden'); $('toggleEdit').textContent='Edit interns'; }
};
$('date').value = date; $('date').max = date;
$('date').onchange = e => { if (e.target.value) { date = e.target.value; if (viewRow != null) selDay = date; listenDay(); render(); } };
$('rules').textContent = `Clock-in: on time until ${fmt(ENTRY.onTime)}, late until ${fmt(ENTRY.late)}. Lunch: 1 hour; on time up to 60 min, a bit over up to ${LUNCH_YELLOW} min.`;

let lastMin = -1, lastOver = null;
setInterval(() => {
  const n = crNow();
  $('clock').textContent = fmt(n.minutes).replace(' ', ':' + p2(n.seconds) + ' ');
  // Contador de lunch en vivo (sin redibujar todo)
  const r = isAdmin() ? viewRow : myRow(), L = (r != null && r >= 0) ? (myData[n.date]||{}).lunch : null;
  if (L && L.start && !L.end && $('lunchLeft')) {
    const el = Date.now()-L.start, over = el > LUNCH_MIN*60000;
    if (over !== lastOver) { lastOver = over; render(); }
    $('lunchLeft').textContent = dur(over ? el-LUNCH_MIN*60000 : LUNCH_MIN*60000-el);
    $('lunchEl').textContent = dur(el);
  }
  if (isAdmin() && viewRow == null && n.seconds % 5 === 0) render();
  if (n.minutes !== lastMin) { lastMin = n.minutes; if (!isAdmin() || viewRow != null) render(); $('date').max = n.date; }
}, 1000);

/* ---------- Light mode / oscuro ---------- */
const SUN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(light) {
  document.body.classList.toggle('light', light);
  $('theme').innerHTML = light ? MOON : SUN;
  $('theme').title = light ? 'Dark mode' : 'Light mode';
  localStorage.setItem('att-demo-theme', light ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('att-demo-theme') === 'light');
$('theme').onclick = () => applyTheme(!document.body.classList.contains('light'));

if (db) listenPeople();
</script>
