<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--frozen:#bee9e8;--pacific:#62b6cb;--yale:#1b4965;--pale:#cae9ff;--fresh:#5fa8d3;--muted:#5b7486}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--yale);min-height:100vh;
background:radial-gradient(circle at 10% 0%,var(--pale),transparent 40%),radial-gradient(circle at 90% 90%,var(--frozen),transparent 40%),#f6fbff}
.banner{background:linear-gradient(90deg,var(--pacific),var(--fresh));color:#fff;text-align:center;padding:10px;font-size:14px;font-weight:500}
.wrap{max-width:980px;margin:0 auto;padding:36px 20px;display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
h1{margin:0 0 4px;font-size:28px}.sub{color:var(--muted);margin:0 0 22px}
.card{background:#fff;border-radius:22px;padding:26px;box-shadow:0 8px 28px #1b496518}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input,select{font:inherit;font-size:15px;color:var(--yale);border:2px solid #dbe9f2;border-radius:12px;padding:11px 13px;background:#fbfdff;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--fresh);box-shadow:0 0 0 4px #5fa8d322}
input.filled{border-color:var(--pacific);background:#f0fbfb}
.step{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:16px}.step span{width:28px;height:28px;border-radius:50%;background:var(--yale);color:#fff;display:grid;place-items:center;font-size:13px}
button{width:100%;margin-top:20px;border:0;border-radius:999px;padding:14px;font:inherit;font-weight:700;color:#fff;background:var(--yale);cursor:pointer}
.sum h3{margin:0 0 14px}.row{display:flex;justify-content:space-between;color:var(--muted);margin:10px 0}.row.t{color:var(--yale);font-weight:700;border-top:2px dashed #dbe9f2;padding-top:12px}
.item{display:flex;gap:12px;align-items:center;margin-bottom:14px}.thumb{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--frozen),var(--fresh));display:grid;place-items:center;font-size:26px}
.tip{margin-top:16px;background:var(--pale);border-radius:14px;padding:14px;font-size:13px;color:var(--yale)}
#ok{display:none;text-align:center;padding:30px}
@media(max-width:800px){.wrap,.grid{grid-template-columns:1fr}}
</style></head><body>

<script>
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>i.classList.toggle('filled',!!i.value)));
document.getElementById('country').value='CR';
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=id=>document.getElementById(id).value;
 document.getElementById('okTxt').textContent=`${v('fullName')} · ${v('line1')}, ${v('city')} · ${document.getElementById('country').selectedOptions[0].text}`;
 e.target.style.display='none';document.getElementById('ok').style.display='block';};
